name: Build and publish Easy Plast
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.mjs'
      - 'build.mjs'
      - '.github/workflows/build-and-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Build site and copy static assets to repository root
        run: npm run build
      - name: Publish built site for GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html privacy.html assets images config.js favicon.svg .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish Easy Plast static site'
            git push
          fi
